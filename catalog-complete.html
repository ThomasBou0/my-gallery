<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Carlos Jorge - Art Catalog</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Cinzel:wght@400;600;700&family=Raleway:wght@200;300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #033048;
      --surface:   #042d43;
      --border:    #0a5070;
      --red:       #FABE56;
      --red-dim:   #d9a440;
      --cream:     #ffffff;
      --muted:     #8ab4c8;
      --text:      #ffffff;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Cormorant Garamond', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
    }

    /* ── Header ── */
    header {
      position: relative;
      text-align: center;
      padding: 60px 40px 50px;
      border-bottom: 1px solid var(--border);
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse 80% 60% at 50% 0%, rgba(212,44,48,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .header-rule {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-bottom: 20px;
    }
    .header-rule span {
      display: block;
      height: 1px;
      width: 60px;
      background: linear-gradient(90deg, transparent, var(--red-dim));
    }
    .header-rule span:last-child {
      background: linear-gradient(90deg, var(--red-dim), transparent);
    }
    .header-rule i {
      font-style: normal;
      color: var(--red);
      font-size: 10px;
      letter-spacing: 4px;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: clamp(36px, 5vw, 60px);
      line-height: 1.0;
      color: var(--cream);
      letter-spacing: 2px;
    }

    h1 span { color: var(--red); }

    .subtitle {
      font-family: 'Cinzel', serif;
      font-size: clamp(10px, 1.2vw, 13px);
      letter-spacing: 6px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 20px;
      opacity: 0.85;
    }

    .header-desc {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 13px;
      letter-spacing: 3px;
      color: var(--muted);
      text-transform: uppercase;
      margin-top: 22px;
    }

    /* ── Navigation ── */
    nav {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 20px 15px;
      border-bottom: 1px solid var(--border);
    }

    nav a {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      transition: color .3s;
      white-space: nowrap;
    }
    nav a:hover { color: var(--red); }

    nav select {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 5px 10px;
      cursor: pointer;
      transition: border-color .3s, color .3s;
    }
    nav select:hover { border-color: var(--red); color: var(--red); }
    nav select option { background: var(--surface); color: var(--text); }

    .nav-button {
      font-family: 'Cinzel', serif;
      font-size: 9px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
      padding: 5px 10px;
      cursor: pointer;
      transition: all .3s;
      white-space: nowrap;
    }
    .nav-button:hover {
      border-color: var(--red);
      color: var(--red);
      background: rgba(250, 190, 86, 0.05);
    }

    /* ── Catalog ── */
    .catalog {
      max-width: 1400px;
      margin: 0 auto;
      padding: 60px 40px 100px;
    }

    .section-label {
      text-align: center;
      padding: 0 0 50px;
      margin-bottom: 40px;
      border-bottom: 1px solid var(--border);
    }

    .section-label h2 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-style: italic;
      font-size: clamp(24px, 3vw, 36px);
      color: var(--cream);
      margin-bottom: 10px;
    }

    .section-label p {
      font-family: 'Raleway', sans-serif;
      font-weight: 200;
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--muted);
    }

    /* ── Grid ── */
    .catalog-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 40px;
    }

    /* ── Loading ── */
    .loading-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 2px solid var(--border);
      border-top-color: var(--red);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
      font-family: 'Cinzel', serif;
      font-size: 12px;
      letter-spacing: 2px;
    }

    /* ── Artwork Card ── */
    .artwork-card {
      background: rgba(4, 45, 67, 0.3);
      border: 1px solid var(--border);
      overflow: hidden;
      transition: all .4s ease;
      cursor: pointer;
      animation: fadeIn .6s ease both;
    }

    .artwork-card:hover {
      background: rgba(4, 45, 67, 0.5);
      border-color: var(--red-dim);
      transform: translateY(-5px);
      box-shadow: 0 8px 30px rgba(212, 44, 48, 0.15);
    }

    .artwork-card:nth-child(odd) { animation-delay: .1s; }
    .artwork-card:nth-child(even) { animation-delay: .2s; }

    /* ── Status Badge ── */
    .status-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      font-family: 'Cinzel', serif;
      font-size: 8px;
      letter-spacing: 2px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 2px;
      z-index: 2;
    }
    .status-sold {
      background: rgba(220, 53, 69, 0.85);
      color: #fff;
    }
    .status-reserved {
      background: rgba(255, 165, 0, 0.85);
      color: #fff;
    }

    /* ── Image ── */
    .artwork-image {
      position: relative;
      width: 100%;
      aspect-ratio: 4/3;
      overflow: hidden;
      background: var(--surface);
    }

    .artwork-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform .6s ease, filter .4s ease;
      filter: brightness(0.9);
    }

    .artwork-card:hover .artwork-image img {
      transform: scale(1.08);
      filter: brightness(1);
    }

    .no-image {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #042d43, #033048);
      color: var(--border);
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── Info ── */
    .artwork-info {
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .artwork-info .artist {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .artwork-info h3 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 600;
      font-style: italic;
      font-size: 26px;
      color: var(--cream);
      margin-bottom: 12px;
      line-height: 1.2;
    }

    .artwork-info .medium {
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .artwork-info .size {
      font-family: 'Raleway', sans-serif;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 15px;
    }

    .artwork-info .price {
      font-family: 'Cinzel', serif;
      font-size: 16px;
      font-weight: 300;
      letter-spacing: 0.5px;
      color: var(--cream);
      opacity: 0.75;
      padding-top: 15px;
      border-top: 1px solid var(--border);
      text-align: right;
      margin-top: auto;
    }

    /* ── Lightbox ── */
    #lightbox {
      position: fixed;
      inset: 0;
      background: rgba(3, 48, 72, 0.97);
      z-index: 10000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 40px;
    }
    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      object-fit: contain;
      box-shadow: 0 0 80px rgba(212, 44, 48, 0.1);
      border: 1px solid var(--border);
    }

    .lb-close {
      position: fixed;
      top: 30px;
      right: 40px;
      font-family: 'Raleway', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--muted);
      cursor: pointer;
      text-transform: uppercase;
      transition: color .3s;
      z-index: 10001;
    }
    .lb-close:hover { color: var(--red); }

    .lb-info {
      position: fixed;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10001;
    }
    .lb-info .title {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 20px;
      color: var(--cream);
      margin-bottom: 5px;
    }
    .lb-info .artist {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 3px;
      color: var(--red);
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .lb-info .details {
      font-family: 'Raleway', sans-serif;
      font-size: 12px;
      color: var(--muted);
    }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 40px;
      margin-top: 60px;
    }
    footer p {
      font-family: 'Cinzel', serif;
      font-size: 10px;
      letter-spacing: 4px;
      color: var(--muted);
      text-transform: uppercase;
    }
    .footer-rule {
      width: 60px;
      height: 1px;
      background: var(--red-dim);
      margin: 15px auto;
      opacity: 0.4;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      nav {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        padding: 10px 8px;
      }
      nav a, nav select, nav .nav-button {
        font-size: 5.5px !important;
        letter-spacing: 0.2px !important;
        padding: 5px 3px !important;
        text-align: center;
        width: 100%;
      }
      .catalog { padding: 40px 15px 80px; }
      .catalog-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
      .artwork-info { padding: 10px; min-height: 140px; }
      .artwork-info h3 { font-size: 7px; margin-bottom: 3px; }
      .artwork-info .artist { font-size: 6px; margin-bottom: 3px; }
      .artwork-info .medium, .artwork-info .size { font-size: 6px; margin-bottom: 2px; }
      .artwork-info .price { font-size: 6px; padding-top: 4px; }
      #lightbox { padding: 20px; }
      .lb-close { top: 15px; right: 20px; font-size: 10px; }
      .lb-info { bottom: 20px; }
      .lb-info .title { font-size: 16px; }
    }

    /* ── Print ── */
    @media print {
      @page { margin: 1.5cm; size: A4; }
      body::before { display: none; }
      body { background: white !important; }
      nav { display: none !important; }
      header { padding: 30px 20px 20px; border-bottom: 2px solid #0a5070; }
      .catalog { padding: 20px 0; }
      .catalog-grid { grid-template-columns: repeat(3, 1fr) !important; gap: 15px !important; }
      .artwork-card { page-break-inside: avoid; background: #f8f8f8 !important; border: 1px solid #0a5070 !important; }
      .artwork-image img { filter: none !important; }
      .artwork-info { padding: 12px !important; min-height: auto !important; }
      .artwork-info h3 { font-size: 11px !important; color: #033048 !important; }
      .artwork-info .artist { font-size: 7px !important; color: #FABE56 !important; }
      .artwork-info .medium, .artwork-info .size { font-size: 8px !important; color: #555 !important; }
      .artwork-info .price { font-size: 9px !important; color: #033048 !important; opacity: 1 !important; }
      #lightbox { display: none !important; }
      .loading-state, .empty-state { display: none; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-rule">
    <span></span><i>✦</i><span></span>
  </div>
  <p class="subtitle">Exhibition Catalogue</p>
  <h1><span>Carlos</span> <span>Jorge</span></h1>
  <p class="header-desc" id="artworkCount">All Artworks &nbsp;·&nbsp; Fine Art Presentation</p>
</header>

<nav>
  <a href="index.html">← Home</a>
  <a href="biography.html">Biography</a>
  <select id="sort-select" onchange="sortArtworks(this.value)">
    <option value="">Sort by Price</option>
    <option value="low-high">Price: Low to High</option>
    <option value="high-low">Price: High to Low</option>
  </select>
  <select id="status-filter" onchange="filterByStatus(this.value)">
    <option value="">All Works</option>
    <option value="available">Available</option>
    <option value="sold">Sold</option>
    <option value="reserved">Reserved</option>
  </select>
  <button class="nav-button" onclick="window.print()">Print Catalog</button>
  <button class="nav-button" onclick="shareLink()">Share Link</button>
  <button class="nav-button" onclick="downloadPDF()">Download PDF</button>
</nav>

<div class="catalog">
  <div class="section-label">
    <h2>Works on Exhibition</h2>
    <p>Click any work to enlarge</p>
  </div>
  <div class="catalog-grid" id="catalogGrid">
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p style="font-family:'Cinzel',serif; font-size:11px; letter-spacing:3px; text-transform:uppercase;">Loading collection...</p>
    </div>
  </div>
</div>

<!-- Lightbox -->
<div id="lightbox" onclick="closeLightbox()">
  <span class="lb-close">✕ &nbsp;Close</span>
  <img id="lb-img" src="" alt="" onclick="event.stopPropagation()"/>
  <div class="lb-info" onclick="event.stopPropagation()">
    <div class="artist" id="lb-artist"></div>
    <div class="title" id="lb-title"></div>
    <div class="details" id="lb-details"></div>
  </div>
</div>

<footer>
  <div class="footer-rule"></div>
  <p>Carlos Jorge · Art Collection</p>
  <div class="footer-rule"></div>
</footer>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
  import { getFirestore, collection, getDocs, query, orderBy } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js';

  const firebaseConfig = {
    apiKey: "AIzaSyBqhrpdW3EfWTt5nEzIgYm1ZgQ9xNY9boQ",
    authDomain: "art4-gallery-2.firebaseapp.com",
    projectId: "art4-gallery-2",
    storageBucket: "art4-gallery-2.firebasestorage.app",
    messagingSenderId: "609814180320",
    appId: "1:609814180320:web:22be08dc05b8099ae0fb85"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let allArtworks = [];
  let currentFilter = '';
  let artistCurrencies = {}; // artistId -> currency code

  // Currency symbol helper
  const CURRENCY_SYMBOLS = { USD: '$', EUR: '€', GBP: '£', MXN: 'MX$' };
  function getCurrencySymbol(code) { return CURRENCY_SYMBOLS[code] || '$'; }
  function getArtworkCurrency(artwork) {
    return artistCurrencies[artwork.artistId] || 'USD';
  }
  function formatPrice(artwork) {
    if (!artwork.price) return 'Price on request';
    const symbol = getCurrencySymbol(getArtworkCurrency(artwork));
    return `${symbol}${Number(artwork.price).toLocaleString('en-US')}`;
  }

  // ── Load artists (for currencies) then artworks ──
  async function loadArtworks() {
    try {
      // First load artist currencies
      const artistsSnap = await getDocs(collection(db, 'artists'));
      artistsSnap.forEach(doc => {
        artistCurrencies[doc.id] = doc.data().currency || 'USD';
      });

      const q = query(collection(db, 'artworks'), orderBy('title'));
      const snapshot = await getDocs(q);
      allArtworks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderArtworks(allArtworks);
      updateCount(allArtworks.length);
    } catch (error) {
      console.error('Error loading artworks:', error);
      document.getElementById('catalogGrid').innerHTML = `
        <div class="empty-state">
          <p>Unable to load collection. Please try again later.</p>
        </div>`;
    }
  }

  // ── Render artworks ──
  function renderArtworks(artworks) {
    const grid = document.getElementById('catalogGrid');

    if (artworks.length === 0) {
      grid.innerHTML = '<div class="empty-state"><p>No artworks found.</p></div>';
      return;
    }

    grid.innerHTML = artworks.map(artwork => {
      const imageHtml = (artwork.images && artwork.images.length > 0)
        ? `<img src="${artwork.images[0]}" alt="${artwork.title}" loading="lazy" />`
        : `<div class="no-image">No Image</div>`;

      const statusBadge = artwork.status === 'sold'
        ? `<span class="status-badge status-sold">Sold</span>`
        : artwork.status === 'reserved'
        ? `<span class="status-badge status-reserved">Reserved</span>`
        : '';

      const artistLine = artwork.year
        ? `${artwork.artistName || 'Carlos Jorge'} · ${artwork.year}`
        : `${artwork.artistName || 'Carlos Jorge'}`;

      const priceFormatted = formatPrice(artwork);

      return `
        <div class="artwork-card" 
          data-price="${artwork.price || 0}"
          data-status="${artwork.status || 'available'}"
          data-title="${artwork.title}"
          data-artist="${artistLine}"
          data-medium="${artwork.medium || ''}"
          data-size="${artwork.size || ''}"
          data-price-label="${priceFormatted}"
          data-image="${(artwork.images && artwork.images[0]) || ''}"
          onclick="openLightbox(this)">
          <div class="artwork-image">
            ${statusBadge}
            ${imageHtml}
          </div>
          <div class="artwork-info">
            <div>
              <div class="artist">${artistLine}</div>
              <h3>"${artwork.title}"</h3>
              <div class="medium">${artwork.medium || ''}</div>
              <div class="size">${artwork.size || ''}</div>
            </div>
            <div class="price">${priceFormatted}</div>
          </div>
        </div>`;
    }).join('');
  }

  function updateCount(count) {
    document.getElementById('artworkCount').innerHTML =
      `${count} Work${count !== 1 ? 's' : ''} &nbsp;·&nbsp; Fine Art Presentation`;
  }

  // ── Sort ──
  window.sortArtworks = function(sortType) {
    const filtered = currentFilter
      ? allArtworks.filter(a => (a.status || 'available') === currentFilter)
      : [...allArtworks];

    if (sortType === 'low-high') {
      filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
    } else if (sortType === 'high-low') {
      filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
    } else {
      filtered.sort((a, b) => a.title.localeCompare(b.title));
    }
    renderArtworks(filtered);
    updateCount(filtered.length);
  };

  // ── Filter by status ──
  window.filterByStatus = function(status) {
    currentFilter = status;
    const filtered = status
      ? allArtworks.filter(a => (a.status || 'available') === status)
      : allArtworks;
    
    // Re-apply sort
    const sortType = document.getElementById('sort-select').value;
    if (sortType === 'low-high') filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
    else if (sortType === 'high-low') filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
    
    renderArtworks(filtered);
    updateCount(filtered.length);
  };

  // ── Lightbox ──
  window.openLightbox = function(card) {
    const img = card.dataset.image;
    if (!img) return;
    document.getElementById('lb-img').src = img;
    document.getElementById('lb-title').textContent = `"${card.dataset.title}"`;
    document.getElementById('lb-artist').textContent = card.dataset.artist;
    document.getElementById('lb-details').textContent =
      `${card.dataset.medium} • ${card.dataset.size} • ${card.dataset.priceLabel}`;
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  };

  window.closeLightbox = function() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  };

  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') window.closeLightbox();
  });

  // ── Share ──
  window.shareLink = function() {
    const url = window.location.href;
    if (navigator.share) {
      navigator.share({ title: 'Carlos Jorge - Art Catalog', url }).catch(() => copyToClipboard(url));
    } else {
      copyToClipboard(url);
    }
  };

  function copyToClipboard(text) {
    navigator.clipboard.writeText(text).then(() => alert('Link copied!')).catch(() => {
      const t = document.createElement('textarea');
      t.value = text;
      document.body.appendChild(t);
      t.select();
      document.execCommand('copy');
      document.body.removeChild(t);
      alert('Link copied!');
    });
  }

  window.downloadPDF = function() {
    alert('To save as PDF:\n\n1. Click "Print Catalog"\n2. Choose "Save as PDF"\n3. Click "Save"');
    window.print();
  };

  // ── Init ──
  loadArtworks();
</script>
